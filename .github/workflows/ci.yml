name: CI — build, tests y check de Django

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ================= FRONTEND (Angular) =================
  frontend:
    name: Frontend — build + tests (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias (lockfile exacto)
        run: npm ci

      - name: Lint (Prettier)
        run: npm run lint

      - name: Build de produccion (budgets AoT activos)
        run: npm run build

      - name: Pruebas unitarias (Vitest + cobertura)
        run: npm run test:ci

      - name: Auditoria de dependencias (npm audit)
        run: npm audit --audit-level=high

  # ================= BACKEND (Django) =================
  backend:
    name: Backend — check + migraciones + tests sobre MySQL
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: intersoft1_db
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
        ports:
          - 3306:3306
    env:
      # DEBUG=False ejercita las protecciones de produccion del settings
      # (SECRET_KEY y ALLOWED_HOSTS obligatorios; fail-fast si algo falta).
      DEBUG: 'False'
      SECRET_KEY: ci-only-secret-para-pipeline-no-usar-en-produccion-2026
      ALLOWED_HOSTS: localhost,127.0.0.1
      DB_NAME: intersoft1_db
      DB_USER: root
      DB_PASSWORD: root
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      IA_PROVIDER: mock
      WA_VINCULADO: 'False'
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar dependencias del sistema (compilar mysqlclient)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config default-libmysqlclient-dev

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias (pinned)
        run: pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Sin migraciones pendientes (modelos sincronizados)
        run: python manage.py makemigrations --check --dry-run

      - name: Aplicar migraciones (instalacion limpia + merge)
        run: python manage.py migrate

      - name: Suite de pruebas backend (Django test runner)
        run: python manage.py test

      - name: Instalar herramientas de calidad (dev)
        run: pip install -r requirements-dev.txt

      - name: Lint Python (ruff)
        run: python -m ruff check core cuentas intersoft --exclude "*/migrations/*"

      - name: Analisis estatico de seguridad (bandit)
        run: python -m bandit -r core cuentas intersoft -c bandit.yaml -q

      - name: Cobertura minima (70% de lineas)
        run: |
          python -m coverage run --source=core,cuentas --branch manage.py test core --noinput
          python -m coverage report --fail-under=70