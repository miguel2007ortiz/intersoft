<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>No encontrado · InterSoft</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh; display: grid; place-items: center;
    font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif;
    background: #F5F7FA; color: #101828; padding: 24px;
  }
  .tarjeta {
    max-width: 460px; width: 100%; background: #FFFFFF; border: 1px solid #DCE3EE;
    border-radius: 14px; padding: 40px 36px; text-align: center;
    box-shadow: 0 1px 3px rgba(0,0,0,.06), 0 16px 32px rgba(38,87,217,.08);
  }
  .codigo {
    font-size: 44px; font-weight: 800;
    background: linear-gradient(135deg, #2657D9, #16326E);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    margin-bottom: 8px;
  }
  h1 { font-size: 20px; margin: 0 0 10px; }
  p { margin: 0; color: #5B6472; font-size: 15px; line-height: 1.6; }
  .marca { margin-top: 28px; font-size: 13px; color: #5B6472; letter-spacing: .04em; }
  .marca span { color: #2657D9; font-weight: 700; }
</style>
</head>
<body>
  <div class="tarjeta">
    <div class="codigo">404</div>
    <h1>No encontramos esta pagina</h1>
    <p>El recurso que buscas no existe o fue movido.</p>
    <div class="marca">Inter<span>Soft</span></div>
  </div>
</body>
</html>
