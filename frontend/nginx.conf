# =====================================================================
#  InterSoft - configuracion nginx para el contenedor del frontend.
#  Sirve los estaticos de Angular (SPA con fallback a index.html) y
#  hace proxy inverso de la API (/api) y archivos subidos (/media)
#  hacia el servicio backend.
# =====================================================================
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Content-Security-Policy: solo misma origen + data:/blob: para previews
    # de imagen de producto. style-src 'unsafe-inline' es obligatorio para
    # Angular (inyecta estilos en runtime). La SPA habla con /api (mismo
    # servidor via proxy), asi que connect-src 'self' basta aqui.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    # Refuerzo anti-clickjacking tambien a nivel de nginx (X-Frame-Options
    # solo lo emite Django para /api; la SPA la sirve nginx).
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Gzip de estaticos para acelerar las descargas.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # SPA: cualquier ruta no existente cae a index.html (los hashes de
    # Angular hacen que los assets reales ya existan en disco).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache agresiva para assets versionados con hash (outputHashing=all).
    # Re-declara las cabeceras: en nginx un location con add_header propio
    # hereda los del server, asi que el CSP se repite aqui tambien.
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Proxy inverso hacia la API del backend.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Archivos subidos (media) servidos directamente desde el backend.
    location /media/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
}
