<!--
  Marco de las pantallas de sesion. El <ng-content> es donde cada pantalla
  (login, registro, recuperar, restablecer) mete su formulario.
-->
<div class="envoltorio" appBrilloCursor>
  <header class="barra">
    <div class="contenedor barra-int">
      <a routerLink="/" class="logo">Inter<span>Soft</span></a>
      <span class="lema">Tu mejor aliado en la gestion empresarial</span>
    </div>
  </header>

  <main class="contenido">
    <ng-content />
  </main>

  <app-site-footer />
</div>
