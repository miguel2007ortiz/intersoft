<!--
  Aviso de cookies. No bloquea la navegacion; la decision se guarda en
  localStorage para no repetir el aviso en cada visita.
-->
@if (visible()) {
  <div class="aviso-cookies" role="region" aria-label="Aviso de cookies">
    <p>
      Usamos cookies propias para mantener tu sesion iniciada y recordar tus preferencias. No
      compartimos tus datos con terceros.
    </p>
    <button type="button" class="btn btn-primario" (click)="aceptar()">Entendido</button>
  </div>
}
