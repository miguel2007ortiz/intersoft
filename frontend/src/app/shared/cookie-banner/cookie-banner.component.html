@if (visible()) {
  <div class="aviso-cookies" role="region" aria-label="Aviso de cookies">
    <p>
      Usamos cookies propias para mantener tu sesion iniciada y recordar tus preferencias.
      No compartimos tus datos con terceros.
    </p>
    <button type="button" class="btn btn-primario" (click)="aceptar()">Entendido</button>
  </div>
}
