<div
  class="estado"
  [class]="tipo()"
  role="status"
  [attr.aria-live]="tipo() === 'error' ? 'assertive' : 'polite'"
>
  <svg class="icono" viewBox="0 0 24 24" width="48" height="48" aria-hidden="true">
    @switch (tipo()) {
      @case ('error') {
        <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.5" />
        <path d="M12 8v5" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        <circle cx="12" cy="16.2" r="1.1" fill="currentColor" />
      }
      @case ('busqueda') {
        <circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.6" />
        <line
          x1="16"
          y1="16"
          x2="20"
          y2="20"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        />
      }
      @case ('vacio') {
        <rect
          x="5"
          y="4"
          width="14"
          height="17"
          rx="2.5"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
        />
        <line
          x1="9"
          y1="9"
          x2="15"
          y2="9"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
        />
        <line
          x1="9"
          y1="13"
          x2="15"
          y2="13"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
        />
      }
    }
  </svg>

  @if (titulo(); as t) {
    <p class="titulo">{{ t }}</p>
  }
  @if (mensaje(); as m) {
    <p class="mensaje">{{ m }}</p>
  }
  @if (accionTexto(); as a) {
    <button type="button" class="accion" (click)="accion.emit()">{{ a }}</button>
  }
</div>
