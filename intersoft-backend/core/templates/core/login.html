{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesion - InterSoft</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{% static 'core/css/styles.css' %}" rel="stylesheet">
</head>
<body>
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="brand">
            <h1><i class="bi bi-shop"></i> InterSoft</h1>
            <p>Gestion empresarial para tu negocio</p>
        </div>

        {% if messages %}
            {% for message in messages %}
            <div class="alert alert-{{ message.tags }} py-2">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Usuario</label>
                <input type="text" name="username" class="form-control" placeholder="Tu usuario" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label">Contrasena</label>
                <input type="password" name="password" class="form-control" placeholder="Tu contrasena" required>
            </div>
            <button type="submit" class="btn btn-sena w-100 py-2">
                <i class="bi bi-box-arrow-in-right"></i> Entrar
            </button>
        </form>

        <hr class="my-4">
        <p class="text-center mb-0">
            Aun no tienes cuenta?
            <a href="{% url 'core:registro' %}" class="text-sena fw-bold text-decoration-none">Registra tu negocio</a>
        </p>
    </div>
</div>
</body>
</html>
